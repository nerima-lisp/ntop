site_name: ntop
site_description: A terminal system monitor written in Common Lisp.
site_url: https://nerima-lisp.github.io/ntop/

repo_url: https://github.com/nerima-lisp/ntop
repo_name: nerima-lisp/ntop
edit_uri: edit/main/docs/src/

docs_dir: src
site_dir: ../site
strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

copyright: Copyright &copy; takeokunn -- MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  generator: false

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Usage: usage.md
  - Differences from btm: differences.md
  - Architecture: architecture.md
  - Development: development.md
  - Benchmarks: benchmarks.md
